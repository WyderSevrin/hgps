#Locale: messages (e.g. validation errors) in English, whatever the OS language
quarkus.default-locale=en

#Rest
quarkus.rest.path=/api



#DB
quarkus.datasource.db-kind=postgresql
# Dev: the PostgreSQL container from docker-compose.yml (start it with `docker compose up -d`)
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/hgps
%dev.quarkus.datasource.username=hgps
%dev.quarkus.datasource.password=hgps
# Prod: provided by the environment
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
# Test: no URL configured, so Quarkus Dev Services starts a throwaway PostgreSQL container

# We start docker-compose ourselves, Quarkus should not try to start it
quarkus.compose.devservices.enabled=false

# The schema is owned by Flyway, Hibernate must not touch it
quarkus.hibernate-orm.schema-management.strategy=none




#Flyway
quarkus.flyway.migrate-at-start=true
# db/migration = structure (all environments), db/dev-data = sample data (dev only)
quarkus.flyway.locations=db/migration
%dev.quarkus.flyway.locations=db/migration,db/dev-data



#Security (Keycloak / OIDC)
# The backend only accepts bearer tokens; the login itself happens in the frontend (keycloak-js).
quarkus.oidc.application-type=service
# Dev: the Keycloak container from docker-compose.yml
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/hgps
# Prod: provided by the environment
%prod.quarkus.oidc.auth-server-url=${OIDC_URL}
# Test: no URL configured, so Quarkus Dev Services starts a throwaway Keycloak container
# Read by the frontend (GET /api/auth/config), so the Keycloak location is configured in one place
hgps.auth.url=http://localhost:8180
%prod.hgps.auth.url=${OIDC_PUBLIC_URL}
hgps.auth.realm=hgps
hgps.auth.client-id=hgps-frontend



#Quinoa
quarkus.quinoa.package-manager-install.node-version=20.10.0
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.ui-root-path=/

#For the rerouting to /index.html
quarkus.quinoa.enable-spa-routing=true
